# DocuCraft Flutter — l10n configuration
#
# Tells `flutter gen-l10n` where to find the ARB sources, where to write
# the generated AppLocalizations Dart code, and which class name to use.
#
# Reference: https://docs.flutter.dev/ui/accessibility-and-internationalization/internationalization

arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
