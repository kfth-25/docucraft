<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 720"
     data-pptx-layout="simple-bullet-points-layout"
     data-pptx-theme-color-primary="accent1"
     data-pptx-theme-font-major="major">

  <rect x="0" y="0" width="1280" height="720"
        fill="url(#slideBgGradient)"
        data-pptx-object="shape" data-pptx-prst="rect"/>

  <g data-pptx-slot="header" data-pptx-object="group">
    <text x="96" y="48" width="400" height="40"
          data-pptx-slot="companyName"
          data-pptx-object="text"
          data-pptx-theme-font="minor"
          data-pptx-theme-color="tx1"
          font-size="16" font-weight="normal">
      {{companyName}}
    </text>
  </g>

  <g data-pptx-slot="mainContent" data-pptx-object="group">
    <text x="96" y="140" width="1088" height="80"
          data-pptx-slot="title"
          data-pptx-object="text"
          data-pptx-theme-font="major"
          data-pptx-theme-color="dk1"
          font-size="56" font-weight="bold">
      {{title}}
    </text>

    <text x="96" y="260" width="1088" height="40"
          data-pptx-slot="statement"
          data-pptx-object="text"
          data-pptx-theme-font="minor"
          data-pptx-theme-color="tx1"
          font-size="20" font-weight="normal">
      {{statement}}
    </text>

    <g data-pptx-slot="points" data-pptx-object="group">
      <g data-pptx-slot="point-0" data-pptx-object="group" transform="translate(96, 340)">
        <circle cx="20" cy="30" r="16"
                fill="var(--theme-accent1)"
                data-pptx-object="shape" data-pptx-prst="ellipse"/>
        <text x="20" y="35" text-anchor="middle"
              fill="white" font-size="14" font-weight="bold">1</text>
        <text x="60" y="20" width="1000" height="80"
              data-pptx-slot="points[0].title"
              data-pptx-object="text"
              data-pptx-theme-font="major"
              data-pptx-theme-color="dk1"
              font-size="24" font-weight="bold">
          {{points[0].title}}
        </text>
        <text x="60" y="55" width="1000" height="60"
              data-pptx-slot="points[0].body"
              data-pptx-object="text"
              data-pptx-theme-font="minor"
              data-pptx-theme-color="tx1"
              font-size="16" line-height="1.5">
          {{points[0].body}}
        </text>
      </g>

      <g data-pptx-slot="point-1" data-pptx-object="group" transform="translate(96, 460)">
        <circle cx="20" cy="30" r="16"
                fill="var(--theme-accent1)"
                data-pptx-object="shape" data-pptx-prst="ellipse"/>
        <text x="20" y="35" text-anchor="middle"
              fill="white" font-size="14" font-weight="bold">2</text>
        <text x="60" y="20" width="1000" height="80"
              data-pptx-slot="points[1].title"
              data-pptx-object="text"
              data-pptx-theme-font="major"
              data-pptx-theme-color="dk1"
              font-size="24" font-weight="bold">
          {{points[1].title}}
        </text>
        <text x="60" y="55" width="1000" height="60"
              data-pptx-slot="points[1].body"
              data-pptx-object="text"
              data-pptx-theme-font="minor"
              data-pptx-theme-color="tx1"
              font-size="16" line-height="1.5">
          {{points[1].body}}
        </text>
      </g>

      <g data-pptx-slot="point-2" data-pptx-object="group" transform="translate(96, 580)">
        <circle cx="20" cy="30" r="16"
                fill="var(--theme-accent1)"
                data-pptx-object="shape" data-pptx-prst="ellipse"/>
        <text x="20" y="35" text-anchor="middle"
              fill="white" font-size="14" font-weight="bold">3</text>
        <text x="60" y="20" width="1000" height="80"
              data-pptx-slot="points[2].title"
              data-pptx-object="text"
              data-pptx-theme-font="major"
              data-pptx-theme-color="dk1"
              font-size="24" font-weight="bold">
          {{points[2].title}}
        </text>
        <text x="60" y="55" width="1000" height="60"
              data-pptx-slot="points[2].body"
              data-pptx-object="text"
              data-pptx-theme-font="minor"
              data-pptx-theme-color="tx1"
              font-size="16" line-height="1.5">
          {{points[2].body}}
        </text>
      </g>
    </g>
  </g>

  <defs>
    <linearGradient id="slideBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--theme-accent1)"/>
      <stop offset="100%" stop-color="var(--theme-dk1)"/>
    </linearGradient>
  </defs>
</svg>