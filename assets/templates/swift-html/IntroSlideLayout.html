<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base: slide wrap */
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .slide-wrap { width: 100%; max-width: 1280px; aspect-ratio: 16/9; overflow: hidden; position: relative; }
    .slide {
      width: 100%; height: 100%; position: relative;
      font-family: 'Albert Sans', sans-serif;
      background: #FFFFFF;
    }
    /* ── TSX: <div className="px-12 pt-6 pb-2"> ── */
    .header { padding: 24px 48px 8px 48px; display: flex; align-items: center; gap: 12px; }
    .diamond { width: 12px; height: 12px; background: #111827; transform: rotate(45deg); flex-shrink: 0; }
    /* ── TSX: absolute top-0 right-0 h-[520px] w-[36%] ── */
    .right-panel { position: absolute; top: 0; right: 0; width: 36%; height: 520px; overflow: hidden; }
    .right-panel img { width: 100%; height: 100%; object-fit: cover; }
    /* ── TSX: absolute top-8 right-[38%] flex flex-col items-center gap-3 ── */
    .diamonds-vertical { position: absolute; top: 32px; right: 38%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    /* ── TSX: grid grid-cols-[58%_42%] gap-10 px-12 pt-4 pb-10 ── */
    .content-grid {
      display: grid; grid-template-columns: 58% 42%; gap: 40px;
      padding: 16px 48px 40px 48px;
    }
    .content-grid > div:first-child { padding-top: 16px; }
    .title { font-size: 64px; font-weight: 600; line-height: 1.05; color: #111827; margin: 0; }
    .paragraph { font-size: 16px; line-height: 1.6; color: #6B7280; margin: 20px 0 0 0; max-width: 620px; }
    /* ── Intro card ── */
    .intro-card {
      display: inline-flex; align-items: center; gap: 16px;
      margin-top: 24px; padding: 12px 16px; border-radius: 2px;
      background: #BFF4FF; border: 1px solid #BFF4FF;
    }
    .intro-card .accent { width: 8px; height: 24px; background: #111827; }
    .intro-card .name { font-size: 16px; font-weight: 600; color: #111827; }
    .intro-card .date { font-size: 14px; color: #6B7280; }
    /* ── TSX: absolute bottom-8 left-12 right-12 ── */
    .footer { position: absolute; bottom: 32px; left: 48px; right: 48px; display: flex; align-items: center; gap: 24px; }
    .footer-line { height: 2px; flex: 1; background: #E5E7EB; }
    .footer-text { font-size: 14px; color: #6B7280; white-space: nowrap; }
    /* ── TSX: absolute bottom-7 right-6 w-8 h-8 rotate-45 ── */
    .diamond-br { position: absolute; bottom: 28px; right: 24px; width: 32px; height: 32px; background: #111827; transform: rotate(45deg); }
    /* ── Mobile responsive ── */
    @media (max-width: 640px) {
      body { align-items: flex-start; }
      .right-panel { display: none; }
      .diamonds-vertical { display: none; }
      .slide { padding: 4.5vw; }
      .content-grid { grid-template-columns: 1fr; padding: 16px 0 40px 0; gap: 16px; }
      .content-grid > div:first-child { padding-top: 8px; }
      .title { font-size: 7vw; }
      .paragraph { font-size: 13px; max-width: 100%; }
      .footer { left: 0; right: 0; padding: 0 4.5vw; }
      .diamond-br { right: 2vw; }
    }
  </style>
</head>
<body>

<div class="slide-wrap">
  <div class="slide">

    <!-- ── TSX: Header: px-12 pt-6 pb-2 ── -->
    <div class="header">
      <div class="diamond"></div>
    </div>

    <!-- ── TSX: Right panel image ── -->
    <div class="right-panel">
      <img src="https://images.unsplash.com/photo-1522199710521-72d69614c702?w=1200&q=80&auto=format&fit=crop" alt="abstract gradient background"/>
    </div>

    <!-- ── TSX: Vertical diamonds, top-8 right-[38%] ── -->
    <div class="diamonds-vertical">
      <div class="diamond"></div>
      <div class="diamond"></div>
      <div class="diamond"></div>
    </div>

    <!-- ── TSX: grid grid-cols-[58%_42%] gap-10 px-12 pt-4 pb-10 ── -->
    <div class="content-grid">
      <div>
        <h1 class="title">Pitch Deck</h1>
        <p class="paragraph">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        <div class="intro-card">
          <div class="accent"></div>
          <span class="name">John Doe</span>
          <span class="date">Jan 1, 2025</span>
        </div>
      </div>
      <div></div>
    </div>

    <!-- ── TSX: Footer ── -->
    <div class="footer">
      <span class="footer-text">www.yourwebsite.com</span>
      <div class="footer-line"></div>
    </div>
    <div class="diamond-br"></div>

  </div>
</div>

</body>
</html>
