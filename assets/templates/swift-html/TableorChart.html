<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .slide-wrap { width: 100%; max-width: 1280px; aspect-ratio: 16/9; overflow: hidden; position: relative; }
    .slide { width: 100%; height: 100%; position: relative; font-family: 'Albert Sans', sans-serif; background: #FFFFFF; }
    .diamond { width: 12px; height: 12px; background: #111827; transform: rotate(45deg); flex-shrink: 0; }
    .header { padding: 24px 48px 8px 48px; display: flex; align-items: center; gap: 12px; }
    /* ── TSX: px-12 pt-3 ── */
    .title-block { padding: 12px 48px 0 48px; }
    .title { font-size: 48px; font-weight: 600; line-height: 1.1; color: #111827; margin: 0; }
    .description { font-size: 16px; color: #6B7280; margin: 12px 0 0 0; max-width: 900px; }
    /* ── TSX: px-12 pt-6 ── */
    .content-block { padding: 24px 48px 0 48px; }
    /* ── TSX: rounded-xl p-5 bg BFF4FF ── */
    .table-wrapper { border-radius: 12px; padding: 20px; background: #BFF4FF; }
    /* ── TSX: overflow-x-auto rounded-lg bg-white ring-1 ── */
    .table-inner { overflow-x: auto; border-radius: 8px; background: #fff; border: 1px solid #E5E7EB; }
    /* ── TSX: border-separate border-spacing-0 ── */
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    /* ── TSX: text-left text-[14px] font-semibold px-4 py-3 border-b bg BFF4FF ── */
    th {
      text-align: left; font-size: 14px; font-weight: 600;
      padding: 12px 16px; border-bottom: 1px solid #E5E7EB;
      background: #BFF4FF; color: #111827;
    }
    th:first-child { border-radius: 8px 0 0 0; }
    th:last-child { border-radius: 0 8px 0 0; }
    /* ── TSX: text-[14px] px-4 py-3 border-t, zebra rows ── */
    td {
      font-size: 14px; padding: 12px 16px;
      border-top: 1px solid rgba(0,0,0,0.08);
      color: #6B7280; vertical-align: top;
    }
    tr:nth-child(even) td { background: #F3F4F6; }
    tr:nth-child(odd) td { background: #BFF4FF; }
    /* ── Footer ── */
    .footer { position: absolute; bottom: 32px; left: 48px; right: 48px; display: flex; align-items: center; gap: 24px; z-index: 2; }
    .footer-line { height: 2px; flex: 1; background: #111827; }
    .diamond-br { position: absolute; bottom: 28px; right: 24px; width: 32px; height: 32px; background: #111827; transform: rotate(45deg); z-index: 2; }
    /* ── Mobile ── */
    @media (max-width: 640px) {
      body { align-items: flex-start; }
      .slide { padding: 4.5vw; }
      .title-block { padding: 12px 0 0 0; }
      .title { font-size: 6.5vw; }
      .content-block { padding: 24px 0 0 0; }
      .table-wrapper { padding: 12px; }
      .footer { left: 0; right: 0; padding: 0 4.5vw; }
      .diamond-br { right: 2vw; }
    }
  </style>
</head>
<body>

<div class="slide-wrap">
  <div class="slide">

    <!-- ── Header ── -->
    <div class="header"><div class="diamond"></div></div>

    <!-- ── Title + description ── -->
    <div class="title-block">
      <h1 class="title">Data Table or Chart</h1>
      <p class="description">Present structured information in a flexible table or visualize it with a chart.</p>
    </div>

    <!-- ── Table ── -->
    <div class="content-block">
      <div class="table-wrapper">
        <div class="table-inner">
          <table>
            <thead>
              <tr>
                <th>Column 1</th>
                <th>Column 2</th>
                <th>Column 3</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Row A</td><td>✓</td><td>-</td></tr>
              <tr><td>Row B</td><td>Text</td><td>123</td></tr>
              <tr><td>Row C</td><td>More text</td><td>456</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── Footer ── -->
    <div class="footer">
      <span style="color: #6B7280; font-size: 14px; white-space: nowrap;">www.yourwebsite.com</span>
      <div class="footer-line"></div>
    </div>
    <div class="diamond-br"></div>

  </div>
</div>

</body>
</html>
